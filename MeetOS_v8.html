<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetOS</title>
<style>
:root{--fw:255,255,255;--fk:0,0,0;--bg:#0b1020;--glass:rgba(22,28,48,.62);--glass2:rgba(34,42,68,.75);--line:rgba(var(--fw),.12);--txt:#e8ecf8;--dim:#98a2c3;--acc:#4cc9b0;--acc2:#7c8cff;--red:#ff5d6c}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Tahoma,sans-serif;color:var(--txt);background:var(--bg)}
#wall{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#2b2f6b 0,transparent 45%),radial-gradient(circle at 80% 70%,#0f5a5a 0,transparent 50%),linear-gradient(135deg,#0b1020,#151a35);background-size:cover;background-position:center;transition:background .5s}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line)}
/* lock */
#lock{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 30% 30%,#33388a 0,transparent 50%),radial-gradient(circle at 75% 75%,#117a73 0,transparent 55%),#0b1020;transition:transform .6s cubic-bezier(.7,0,.3,1),opacity .6s}
#lock.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
#lock .time{font-size:96px;font-weight:200;letter-spacing:-2px}
#lock .date{font-size:20px;color:var(--dim);margin-bottom:34px}
#lock .logo{font-size:30px;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#lock .avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:38px;margin-top:10px}
#lock button{margin-top:14px;padding:12px 40px;border:0;border-radius:30px;font-size:16px;font-weight:600;cursor:pointer;color:#06201c;background:var(--acc);transition:transform .15s,box-shadow .15s}
#lock button:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(76,201,176,.5)}
#lock small{color:var(--dim)}
/* desktop */
#desktop{position:fixed;inset:0 0 48px 0}
.icon{position:absolute;width:84px;padding:8px 4px;text-align:center;border-radius:10px;cursor:default;font-size:12.5px;text-shadow:0 1px 4px #000}
.icon:hover{background:rgba(var(--fw),.12)}.icon.sel{background:rgba(124,140,255,.3);outline:1px solid var(--acc2)}
.icon .ic{font-size:40px;line-height:1.2;filter:drop-shadow(0 3px 6px rgba(var(--fk),.5))}
/* window */
.win{position:absolute;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(var(--fk),.55);animation:pop .18s ease-out;background:var(--glass2);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--line)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0}
.win.min{display:none}
.win.focus{border-color:rgba(124,140,255,.6)}
.tb{display:flex;align-items:center;height:38px;padding:0 0 0 12px;background:rgba(var(--fk),.25);cursor:move;flex:none}
.tb .t{flex:1;font-size:13px;display:flex;gap:8px;align-items:center}
.tb button{width:46px;height:38px;border:0;background:transparent;color:var(--txt);font-size:14px;cursor:pointer}
.tb button:hover{background:rgba(var(--fw),.14)}.tb .x:hover{background:var(--red)}
.body{flex:1;overflow:auto;position:relative;min-height:0}
/* taskbar */
#task{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:5000;display:flex;align-items:center;padding:0 8px;gap:6px;border-radius:0;border-width:1px 0 0}
#start{width:40px;height:36px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:20px;color:var(--acc)}
#start:hover,#start.on{background:rgba(var(--fw),.14)}
#apps{flex:1;display:flex;gap:4px;overflow:hidden}
.tbtn{height:36px;padding:0 12px;border:0;border-radius:8px;background:rgba(var(--fw),.06);color:var(--txt);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;max-width:170px;border-bottom:2px solid transparent;white-space:nowrap}
.tbtn:hover{background:rgba(var(--fw),.14)}.tbtn.act{background:rgba(var(--fw),.16);border-bottom-color:var(--acc)}.tbtn.mn{opacity:.55}
#tray{display:flex;align-items:center;gap:12px;font-size:12.5px;padding:0 8px;text-align:right}
#tray .tt{cursor:pointer;line-height:1.25;text-align:center}
/* start menu */
#menu{position:fixed;left:8px;bottom:56px;width:340px;border-radius:14px;padding:14px;z-index:6000;display:none;animation:pop .15s}
#menu.show{display:block}
#menu h4{font-size:12px;color:var(--dim);font-weight:500;margin:4px 8px 8px}
#menu .item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
#menu .item:hover{background:rgba(var(--fw),.12)}
#menu .item span{font-size:22px}
#menu .pw{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
#menu .pw button{flex:1;padding:10px;border:0;border-radius:8px;background:rgba(var(--fw),.08);color:var(--txt);cursor:pointer;font-size:13px}
#menu .pw button:hover{background:var(--red)}
#menu .pw button.rs:hover{background:var(--acc2)}
/* apps */
.calc{display:grid;grid-template-rows:auto 1fr;height:100%;padding:10px;gap:10px}
.calc .scr{background:rgba(var(--fk),.35);border-radius:10px;padding:10px 14px;text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end}
.calc .scr small{color:var(--dim);font-size:13px;min-height:18px}.calc .scr b{font-size:34px;font-weight:300;word-break:break-all}
.calc .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .pad button{border:0;border-radius:8px;background:rgba(var(--fw),.1);color:var(--txt);font-size:18px;cursor:pointer;min-height:44px}
.calc .pad button:hover{background:rgba(var(--fw),.2)}.calc .pad .op{background:rgba(124,140,255,.35)}.calc .pad .eq{background:var(--acc);color:#06201c;font-weight:700}
.note{display:flex;flex-direction:column;height:100%}
.note .bar{display:flex;gap:8px;padding:8px;align-items:center;font-size:12px;color:var(--dim)}
.note .bar button{padding:6px 14px;border:0;border-radius:6px;background:var(--acc);color:#06201c;cursor:pointer;font-weight:600}
.note textarea{flex:1;resize:none;border:0;outline:0;background:rgba(var(--fk),.28);color:var(--txt);padding:14px;font:15px/1.6 Consolas,monospace;user-select:text}
.set{display:flex;height:100%}.set nav{width:150px;padding:10px;background:rgba(var(--fk),.2)}
.set nav div{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}.set nav div.on,.set nav div:hover{background:rgba(var(--fw),.12)}
.set main{flex:1;padding:18px;overflow:auto}.set h3{margin-bottom:12px}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.walls div{height:70px;border-radius:10px;cursor:pointer;border:2px solid transparent}.walls div:hover{border-color:var(--acc)}
.set input[type=color]{width:60px;height:36px;border:0;background:none;cursor:pointer}
.info td{padding:6px 14px 6px 0;font-size:14px}.info td:first-child{color:var(--dim)}
.exp{display:flex;height:100%}.exp aside{width:150px;padding:10px;background:rgba(var(--fk),.2);font-size:13.5px}
.exp aside div{padding:8px 10px;border-radius:8px;cursor:pointer}.exp aside div:hover,.exp aside div.on{background:rgba(var(--fw),.12)}
.exp section{flex:1;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,96px);gap:10px;align-content:start}
.exp .f{text-align:center;padding:8px;border-radius:8px;font-size:12px;cursor:default}.exp .f:hover{background:rgba(var(--fw),.12)}.exp .f span{font-size:34px;display:block}
.snake{display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px;height:100%}
.snake .hd{display:flex;gap:22px;font-size:14px}.snake canvas{border-radius:10px;background:#0a0f1d;border:1px solid var(--line);max-width:100%}
.snake button{padding:6px 16px;border:0;border-radius:6px;background:var(--acc);color:#06201c;font-weight:600;cursor:pointer}
.toast{position:fixed;right:16px;bottom:62px;padding:12px 18px;border-radius:10px;z-index:7000;animation:pop .2s;font-size:13px}
#off{position:fixed;inset:0;background:#000;z-index:10000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--dim)}
#off.on{display:flex}

/* ===== v1.1 modern layer ===== */
.win{border-radius:14px;box-shadow:0 26px 80px rgba(var(--fk),.6),inset 0 0 0 1px rgba(var(--fw),.05)}
.tb{height:40px;background:rgba(var(--fw),.05)}
#task{justify-content:center;height:48px}
#apps{flex:none}#tray{position:absolute;right:8px;top:0;bottom:0}
#start{font-size:22px;width:44px}
.tbtn{min-width:44px;justify-content:center;padding:0 8px;border-radius:10px}
#menu{left:calc(50% - 215px);width:430px;border-radius:18px;padding:18px}
#menuList{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#menu .item{flex-direction:column;gap:4px;padding:14px 4px;font-size:12px;text-align:center}
#mark{position:fixed;inset:0 0 48px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#fff}
#mark b{font:200 clamp(90px,17vw,240px)/1 "Segoe UI Light","Segoe UI",system-ui,sans-serif;letter-spacing:.06em;opacity:.14}
#mark span{font-size:clamp(13px,1.8vw,22px);letter-spacing:.7em;opacity:.3;margin-top:8px}
body.nomark #mark{display:none}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8000}
#ctx{position:fixed;z-index:8500;display:none;min-width:210px;border-radius:12px;padding:6px}
#ctx div{padding:9px 12px;border-radius:8px;font-size:13.5px;cursor:pointer}#ctx div:hover{background:rgba(var(--fw),.14)}
.ex{display:flex;flex-direction:column;height:100%}
.exbar{display:flex;gap:6px;padding:8px 10px;align-items:center;background:rgba(var(--fw),.04)}
.exbar button{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--txt);cursor:pointer;font-size:15px}.exbar button:hover{background:rgba(var(--fw),.14)}
.addr{flex:1;padding:7px 14px;border-radius:8px;background:rgba(var(--fk),.28);font-size:13px;white-space:nowrap;overflow:hidden}
.exbar input{width:140px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(var(--fk),.28);color:var(--txt);outline:0;user-select:text}
.exmain{flex:1;display:flex;min-height:0}
.exmain aside{width:170px;padding:8px;background:rgba(var(--fk),.18);overflow:auto;font-size:13.5px}
.exmain aside div{padding:9px 12px;border-radius:8px;cursor:pointer}.exmain aside div:hover,.exmain aside div.on{background:rgba(var(--fw),.13)}
.exmain section{flex:1;padding:14px;overflow:auto}
.exmain h5{font-size:12.5px;color:var(--dim);font-weight:500;margin:4px 0 8px}
.drv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.d{display:flex;gap:10px;padding:12px;border-radius:12px;background:rgba(var(--fw),.06)}.d:hover{background:rgba(var(--fw),.12)}
.d span{font-size:34px}.d div{flex:1}.d b{font-size:13px;display:block;font-weight:500}
.d i{display:block;height:6px;border-radius:3px;background:rgba(var(--fw),.15);margin:7px 0;overflow:hidden}.d u{display:block;height:100%;background:var(--acc)}.d small{color:var(--dim);font-size:11.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,92px);gap:6px}
.grid .f{text-align:center;padding:8px 4px;border-radius:10px;font-size:12px;word-break:break-word}.grid .f:hover{background:rgba(var(--fw),.1)}.grid .f.on{background:rgba(124,140,255,.3)}
.grid .f span{font-size:36px;display:block}
.exst{padding:6px 14px;font-size:12px;color:var(--dim);background:rgba(var(--fk),.22)}
.walls{grid-template-columns:repeat(4,1fr)}
.set nav{width:170px;background:rgba(var(--fk),.18)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px;border-radius:12px;background:rgba(var(--fw),.06);margin-bottom:8px;font-size:14px}
.row input[type=range]{width:170px;accent-color:var(--acc)}.row input[type=checkbox]{accent-color:var(--acc);width:20px;height:20px}
.sw{display:flex;gap:7px}.sw i{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid rgba(var(--fw),.4)}
.hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:linear-gradient(135deg,rgba(124,140,255,.3),rgba(76,201,176,.25));margin-bottom:14px}.hero span{font-size:40px}
.chess{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;height:100%}.cs{font-size:14px}
.cb{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,400px);aspect-ratio:1;border-radius:10px;overflow:hidden}
.cb div{display:grid;place-items:center;font-size:34px;cursor:pointer;position:relative}
.cb .lt{background:#cfd8e8}.cb .dk{background:#5b6b94}
.cb .sel{outline:3px solid var(--acc);outline-offset:-3px}.cb .lm{box-shadow:inset 0 0 0 100px rgba(255,214,0,.25)}
.cb .mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(var(--fk),.3)}
.cb b{font-weight:400;position:relative;z-index:1}.cb .w{color:#fff;text-shadow:0 0 2px #000,0 1px 3px #000}.cb .bl{color:#14162a;text-shadow:0 0 1px rgba(var(--fw),.5)}
.chess button,.g48 button,.mh button{padding:6px 16px;border:0;border-radius:8px;background:var(--acc);color:#06201c;font-weight:600;cursor:pointer}
.g48,.mnes{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.g48 .hd,.mh{display:flex;gap:18px;align-items:center;font-size:14px}.g48 small{color:var(--dim)}
.tl{display:grid;grid-template-columns:repeat(4,80px);gap:8px;padding:8px;border-radius:12px;background:rgba(var(--fk),.3)}
.tl div{height:80px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:26px;color:#fff;transition:background .15s}
.ms{display:grid;grid-template-columns:repeat(9,34px);gap:3px}
.ms button{width:34px;height:34px;border:0;border-radius:7px;background:rgba(var(--fw),.17);color:var(--txt);font-weight:700;font-size:15px;cursor:pointer}
.ms button.o{background:rgba(var(--fk),.32)}.ms [data-n="1"]{color:#6cf}.ms [data-n="2"]{color:#7e7}.ms [data-n="3"]{color:#f77}.ms [data-n="4"],.ms [data-n="5"]{color:#c9f}

.logo{display:flex;align-items:center;gap:14px;font-size:36px}
#menu h4{display:flex;align-items:center;gap:8px}
.tb .t svg{flex:none}
.qk{padding:8px 18px;border:0;border-radius:20px;background:rgba(var(--fw),.1);color:var(--txt);cursor:pointer;font-size:13px}.qk:hover{background:var(--acc);color:#06201c}
.xo{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
.xo .hd{display:flex;gap:18px;font-size:14px}.xo .bt{display:flex;gap:8px}
.xo button.c{padding:7px 16px;border:0;border-radius:8px;background:var(--acc);color:#06201c;font-weight:600;cursor:pointer}
.xb{display:grid;grid-template-columns:repeat(3,96px);gap:8px}
.xb button{height:96px;border:0;border-radius:14px;background:rgba(var(--fw),.08);font-size:46px;font-weight:700;cursor:pointer;color:var(--txt)}
.xb button:hover{background:rgba(var(--fw),.15)}.xb .X{color:var(--acc)}.xb .O{color:#ff6b9d}.xb .win{background:rgba(var(--fw),.25)}

/* ===== v1.3 modern icons & apps ===== */
.icon{border-radius:12px;border:1px solid transparent}.icon.sel{border-color:rgba(124,140,255,.5)}
.icon .ic{display:flex;justify-content:center;margin-bottom:6px;line-height:0}
.icon .ic svg{filter:drop-shadow(0 6px 10px rgba(var(--fk),.45));transition:transform .15s}.icon:hover .ic svg{transform:translateY(-2px) scale(1.06)}
#menu .item span,.tbtn span{display:flex}#menu .item{border-radius:12px}
.tbtn{position:relative;background:transparent;border-bottom-color:transparent!important}.tbtn:hover{background:rgba(var(--fw),.1)}.tbtn.act{background:rgba(var(--fw),.1)}
.tbtn::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;border-radius:2px;background:var(--dim);transform:translateX(-50%);transition:width .2s}.tbtn.act::after{width:16px;background:var(--acc)}
#tray .ti{display:flex;gap:11px;align-items:center;padding:7px 11px;border-radius:8px;cursor:pointer}#tray .ti:hover{background:rgba(var(--fw),.1)}
#msr{width:100%;padding:10px 16px;border-radius:20px;border:1px solid var(--line);background:rgba(var(--fk),.3);color:var(--txt);outline:0;margin:2px 0 12px;user-select:text}
#qs{position:fixed;right:10px;bottom:58px;width:330px;border-radius:18px;padding:16px;z-index:6000;display:none;animation:pop .15s}#qs.show{display:block}
.qt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.q{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:rgba(var(--fw),.08);cursor:pointer;font-size:13.5px}.q.on{background:var(--acc);color:#06201c;font-weight:600}.q span{font-size:18px}
#qs .row{justify-content:flex-start}#qs .row input{flex:1;width:auto}
#nl{position:fixed;inset:0;background:rgba(255,150,40,.14);mix-blend-mode:multiply;pointer-events:none;z-index:7999;display:none}
/* My PC drives */
.d{padding:16px;border-radius:16px;background:linear-gradient(180deg,rgba(var(--fw),.1),rgba(var(--fw),.04));border:1px solid var(--line);cursor:pointer;transition:transform .15s,background .15s;align-items:center;gap:14px}
.d:hover{transform:translateY(-2px);background:linear-gradient(180deg,rgba(var(--fw),.16),rgba(var(--fw),.07))}
.d span svg{width:58px;height:58px;display:block}.d b{font-size:14px;margin-bottom:2px}
.d i{height:8px;border-radius:4px}.d u{border-radius:4px;background:linear-gradient(90deg,var(--acc),#7c8cff)}
.exmain aside div.on{box-shadow:inset 3px 0 var(--acc)}.grid .f span{margin-bottom:4px;line-height:0}.grid .f span:not(:has(svg)){line-height:1.2}
/* Calculator */
.calc{grid-template-rows:auto auto 1fr;padding:12px;gap:6px}
.calc .ch{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px;padding:2px 4px}
.calc .scr{background:transparent;padding:4px 8px}.calc .scr b{font-size:46px;font-weight:600}
.calc .pad{gap:5px}.calc .pad button{border-radius:10px;background:rgba(var(--fw),.06);font-size:19px;transition:transform .08s,background .15s}
.calc .pad button:hover{background:rgba(var(--fw),.16)}.calc .pad button:active{transform:scale(.94)}
.calc .pad .dg{background:rgba(var(--fw),.13);font-weight:600}.calc .pad .op{background:rgba(var(--fw),.08);color:var(--acc);font-size:22px}.calc .pad .eq{background:var(--acc);color:#06201c}
/* Snake */
.snake{gap:12px;padding:14px}.snake .hd span{padding:7px 16px;border-radius:20px;background:rgba(var(--fw),.08)}
.snake canvas{border-radius:18px;box-shadow:0 10px 34px rgba(var(--fk),.45),0 0 0 1px rgba(76,201,176,.25)}
.snake button{padding:8px 24px;border-radius:20px}
/* Notepad */
.ntabs{display:flex;padding:6px 8px 0;background:rgba(var(--fw),.04)}
.ntabs .tab{display:flex;gap:8px;align-items:center;padding:7px 14px;border-radius:8px 8px 0 0;background:rgba(10,14,28,.55);font-size:13px}
.note .bar{background:rgba(var(--fk),.18);padding:6px 10px}
.note .bar button{background:transparent;color:var(--txt);font-weight:500;padding:5px 12px}.note .bar button:hover{background:rgba(var(--fw),.12)}
.note .bar span{margin-left:auto}
.note textarea{background:rgba(10,14,28,.55);padding:16px 20px}
.nst{display:flex;justify-content:space-between;padding:5px 14px;font-size:12px;color:var(--dim);background:rgba(var(--fk),.25)}

/* ===== v2.0 ===== */
#desktop,#mark{inset:30px 0 48px 0}.win.max{inset:30px 0 48px 0!important}
#top{position:fixed;top:0;left:0;right:0;height:30px;z-index:5000;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:12px;border-radius:0;border-width:0 0 1px}
#top .tl{display:flex;align-items:center;gap:6px;font-weight:600}#top .sp{flex:1}
#top button{height:22px;padding:0 12px;border:0;border-radius:11px;background:rgba(255,255,255,.1);color:var(--txt);font-size:12px;cursor:pointer}#top button.on{background:var(--acc);color:#06201c;font-weight:600}

/* ---------- clock ---------- */
function tick(){const d=new Date();const t=pad(d.getHours())+':'+pad(d.getMinutes());
 $('#lt').textContent=t;$('#ld').textContent=d.toLocaleDateString(({ar:'ar-EG',de:'de-DE'})[LANG]||'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $('#tt').innerHTML=t+'<br>'+d.toLocaleDateString('en-GB');}
tick();setInterval(tick,1000);

/* ---------- lock ---------- */

function appCalc(b){
 let cur='0',prev=null,op=null,fresh=false;
 const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='];
 b.innerHTML=`<div class="calc"><div class="ch">${ico('calc',16)} Standard</div><div class="scr"><small></small><b>0</b></div><div class="pad">${keys.map(k=>`<button class="${'÷×−+'.includes(k)?'op':k==='='?'eq':/\d/.test(k)?'dg':''}">${k}</button>`).join('')}</div></div>`;
 const out=$('b',b),sm=$('small',b);
 const calc=(a,o,c)=>{a=+a;c=+c;return o==='+'?a+c:o==='−'?a-c:o==='×'?a*c:c===0?NaN:a/c};

  if(/\d/.test(k)){cur=(cur==='0'||fresh)?k:cur+k;fresh=false}
  else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
  else if(k==='C'){cur='0';prev=null;op=null}
  else if(k==='⌫'){cur=cur.length>1&&!fresh?cur.slice(0,-1):'0'}
  else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):(cur==='0'?cur:'-'+cur)}
  else if(k==='%'){cur=fmt(+cur/100)}
  else if('÷×−+'.includes(k)){if(op&&!fresh){cur=fmt(calc(prev,op,cur))}prev=cur;op=k;fresh=true}
  else if(k==='='){if(op){const r=fmt(calc(prev,op,cur));prev=null;op=null;cur=r;fresh=true}}
  upd()}

  const h=sn[0],cx=h.x*C+C/2,cy=h.y*C+C/2;g.fillStyle='#0b1020';

/* ---------- Chess ---------- */
function appChess(b){
 const S={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟\uFE0E'},V={p:1,n:3,b:3,r:5,q:9,k:0};
 const own=(t,w)=>w===(t===t.toUpperCase());
 const mk=()=>"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR".replace(/\d/g,n=>' '.repeat(n)).replace(/\//g,'').split('').map(c=>c===' '?'':c);
 function mv(bd,i,w){const c=bd[i].toLowerCase(),r=i>>3,f=i&7,m=[];
  const add=(y,x)=>{if(y<0||y>7||x<0||x>7)return 0;const j=y*8+x,t=bd[j];if(!t){m.push(j);return 1}if(!own(t,w))m.push(j);return 0};
  if(c==='p'){const d=w?-1:1,y=r+d;if(y>=0&&y<8){if(!bd[y*8+f]){m.push(y*8+f);if(r===(w?6:1)&&!bd[(y+d)*8+f])m.push((y+d)*8+f)}[-1,1].forEach(s=>{const x=f+s,t=bd[y*8+x];if(x>=0&&x<8&&t&&!own(t,w))m.push(y*8+x)})}}
  else if(c==='n')[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([a,e])=>add(r+a,f+e));
  else if(c==='k'){for(let a=-1;a<2;a++)for(let e=-1;e<2;e++)(a||e)&&add(r+a,f+e)}
  else{const ds=(c==='b'?[]:[[1,0],[-1,0],[0,1],[0,-1]]).concat(c==='r'?[]:[[1,1],[1,-1],[-1,1],[-1,-1]]);ds.forEach(([a,e])=>{let y=r+a,x=f+e;while(add(y,x)){y+=a;x+=e}})}
  return m}
 const chk=(bd,w)=>{const k=bd.indexOf(w?'K':'k');return bd.some((t,i)=>t&&!own(t,w)&&mv(bd,i,!w).includes(k))};
 const apply=(bd,i,j)=>{const n=bd.slice();n[j]=n[i];n[i]='';if(n[j]==='P'&&j<8)n[j]='Q';if(n[j]==='p'&&j>55)n[j]='q';return n};
 const legal=(bd,i,w)=>mv(bd,i,w).filter(j=>!chk(apply(bd,i,j),w));
 const all=(bd,w)=>bd.flatMap((t,i)=>t&&own(t,w)?legal(bd,i,w).map(j=>[i,j]):[]);
 const thr=n=>n.reduce((m,t,x)=>t&&own(t,1)?Math.max(m,...mv(n,x,1).map(y=>n[y]?V[n[y].toLowerCase()]:0)):m,0);
 let bd=mk(),sel=-1,lg=[],turn=1,last=[],end='';
 b.innerHTML=`<div class="chess"><div class="cs"></div><div class="cb"></div><button>New game</button><small style="color:var(--dim)">You play white. Click a piece, then a square.</small></div>`;
 function draw(){$('.cs',b).textContent=end||((turn?'Your turn':'Computer is thinking…')+(chk(bd,turn)?' — check!':''));
  $('.cb',b).innerHTML=bd.map((t,i)=>`<div class="${((i>>3)+(i&7))%2?'dk':'lt'}${i===sel?' sel':''}${last.includes(i)?' lm':''}${lg.includes(i)?' mv':''}" data-i="${i}">${t?`<b class="${t===t.toUpperCase()?'w':'bl'}">${S[t.toLowerCase()]}</b>`:''}</div>`).join('')}
 function fin(){if(!all(bd,turn).length)end=chk(bd,turn)?(turn?'Checkmate — the computer wins':'Checkmate — you win! 🎉'):'Stalemate — draw'}
 function ai(){const ms=all(bd,0);if(!ms.length)return;let best=-99,pk;
  ms.forEach(([i,j])=>{const n=apply(bd,i,j);const s=(bd[j]?V[bd[j].toLowerCase()]:0)-thr(n)+(chk(n,1)?.4:0)+(n[j]!==bd[i]?5:0)+Math.random()*.5;if(s>best){best=s;pk=[i,j]}});
  last=pk;bd=apply(bd,pk[0],pk[1]);turn=1;fin();draw()}
 $('.cb',b).onclick=e=>{const d=e.target.closest('[data-i]');if(!d||!turn||end)return;const i=+d.dataset.i;
  if(sel>=0&&lg.includes(i)){last=[sel,i];bd=apply(bd,sel,i);sel=-1;lg=[];turn=0;fin();draw();if(!end)setTimeout(ai,350)}
  else if(bd[i]&&own(bd[i],1)){sel=i;lg=legal(bd,i,1);draw()}else{sel=-1;lg=[];draw()}};
 $('button',b).onclick=()=>{bd=mk();sel=-1;lg=[];turn=1;last=[];end='';draw()};draw();
}

/* ---------- Tic-Tac-Toe ---------- */
function appXO(b){
 let bd,turn,end,vs=1,sc={X:0,O:0,D:0},ln=[];
 const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 const win=B=>{for(const [a,c,d] of L)if(B[a]&&B[a]===B[c]&&B[a]===B[d])return B[a];return B.every(x=>x)?'D':''};
 const mm=(B,t)=>{const w=win(B);if(w)return w==='O'?1:w==='X'?-1:0;let r=t==='O'?-2:2;B.forEach((x,i)=>{if(!x){B[i]=t;const v=mm(B,t==='O'?'X':'O');B[i]='';r=t==='O'?Math.max(r,v):Math.min(r,v)}});return r};
 b.innerHTML=`<div class="xo"><div class="hd"><span>You (X): <b class="x">0</b></span><span>Draws: <b class="d">0</b></span><span class="o"></span></div><div class="cs"></div><div class="xb"></div><div class="bt"><button class="c" data-a="n">New round</button><button class="c" data-a="m"></button></div></div>`;
 function reset(){bd=Array(9).fill('');turn='X';end='';ln=[];draw()}
 function draw(){$('.x',b).textContent=sc.X;$('.d',b).textContent=sc.D;$('.o',b).innerHTML=(vs?'Computer':'Player O')+' (O): <b>'+sc.O+'</b>';
  $('.cs',b).textContent=end==='D'?'It’s a draw':end?(end==='X'?'X wins! 🎉':'O wins!'):'Turn: '+turn;
  $('[data-a=m]',b).textContent=vs?'Mode: vs Computer':'Mode: 2 Players';
  $('.xb',b).innerHTML=bd.map((v,i)=>`<button data-i="${i}" class="${v}${ln.includes(i)?' win':''}">${v}</button>`).join('')}
 function play(i){if(end||bd[i])return;bd[i]=turn;end=win(bd);

/* ---------- Tetris ---------- */
function appTetris(b){
 const W=10,H=20,C=26,SH={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
 const CL={I:'#22d3ee',O:'#facc15',T:'#a78bfa',S:'#4ade80',Z:'#fb7185',J:'#60a5fa',L:'#fb923c'};
 let bd,p,nx,sc,ln,lv,over,run,tm;
 b.innerHTML=`<div class="tet"><div class="hd"><span>Score <b class="s">0</b></span><span>Lines <b class="l">0</b></span><span>Level <b class="v">1</b></span></div><canvas width="${W*C}" height="${H*C}"></canvas><small>← → move · ↑ rotate · ↓ soft drop · Space drop</small></div>`;
 const g=$('canvas',b).getContext('2d');
 const rk=()=>'IOTSZJL'[Math.random()*7|0];
 const mk=k=>({k,m:SH[k].map(r=>r.slice()),x:(W-SH[k][0].length)/2|0,y:0});
 const hit=(m,x,y)=>m.some((r,j)=>r.some((v,i)=>v&&(x+i<0||x+i>=W||y+j>=H||(bd[y+j]&&bd[y+j][x+i]))));
 const speed=()=>Math.max(90,650-lv*55);
 function spawn(){p=mk(nx);nx=rk();if(hit(p.m,p.x,p.y)){over=true;run=false;clearInterval(tm)}}
 function init(){bd=Array.from({length:H},()=>Array(W).fill(0));sc=0;ln=0;lv=1;over=false;run=false;clearInterval(tm);nx=rk();spawn();draw()}
 function start(){if(over)init();run=true;clearInterval(tm);tm=setInterval(step,speed());draw()}
 function lock(){p.m.forEach((r,j)=>r.forEach((v,i)=>{if(v)bd[p.y+j][p.x+i]=CL[p.k]}));
  let n=0;bd=bd.filter(r=>{const f=r.every(v=>v);if(f)n++;return !f});while(bd.length<H)bd.unshift(Array(W).fill(0));
  if(n){sc+=[0,100,300,500,800][n]*lv;ln+=n;const l2=1+(ln/10|0);if(l2!==lv){lv=l2;clearInterval(tm);tm=setInterval(step,speed())}}spawn()}
 function step(){if(!hit(p.m,p.x,p.y+1))p.y++;else lock();draw()}
 function rot(){const m=p.m[0].map((_,i)=>p.m.map(r=>r[i]).reverse());for(const dx of[0,-1,1,-2,2])if(!hit(m,p.x+dx,p.y)){p.m=m;p.x+=dx;return}}
 const blk=(x,y,c,a)=>{g.globalAlpha=a||1;g.fillStyle=c;g.beginPath();g.roundRect?g.roundRect(x*C+1,y*C+1,C-2,C-2,5):g.rect(x*C+1,y*C+1,C-2,C-2);g.fill();g.globalAlpha=1};
 function draw(){g.clearRect(0,0,W*C,H*C);g.fillStyle='rgba(255,255,255,.03)';for(let y=0;y<H;y++)for(let x=0;x<W;x++)if((x+y)%2)g.fillRect(x*C,y*C,C,C);
  bd.forEach((r,y)=>r.forEach((c,x)=>c&&blk(x,y,c)));
  let gy=p.y;while(!hit(p.m,p.x,gy+1))gy++;
  p.m.forEach((r,j)=>r.forEach((v,i)=>{if(v){blk(p.x+i,gy+j,CL[p.k],.22);blk(p.x+i,p.y+j,CL[p.k])}}));
  $('.s',b).textContent=sc;$('.l',b).textContent=ln;$('.v',b).textContent=lv;
  if(over||!run){g.fillStyle='rgba(8,12,24,.75)';g.fillRect(0,0,W*C,H*C);g.fillStyle='#fff';g.textAlign='center';g.font='700 28px "Segoe UI",sans-serif';g.fillText(over?'Game Over':'Tetris',W*C/2,H*C/2-8);g.font='14px "Segoe UI",sans-serif';g.fillStyle='#98a2c3';g.fillText(over?'Score '+sc+' — press a key':'Press any arrow key',W*C/2,H*C/2+20)}}
 const kd=e=>{if(!wins.tetris||!wins.tetris.el.classList.contains('focus'))return;const k=e.key;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))return;e.preventDefault();
  if(!run){start();return}
  if(k==='ArrowLeft'&&!hit(p.m,p.x-1,p.y))p.x--;else if(k==='ArrowRight'&&!hit(p.m,p.x+1,p.y))p.x++;else if(k==='ArrowUp')rot();

 addEventListener('keydown',kd);init();return()=>{clearInterval(tm);removeEventListener('keydown',kd)};
}
